name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore "SerialBench.sln"

      - name: Build
        run: dotnet build "SerialBench.sln" --configuration Release --no-restore

      - name: Test
        run: dotnet test "SerialBench.sln" --configuration Release --no-build
